stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:3.19
  # DEPLOY AUTOMATICO DESATIVADO EM 2026-07-22
  #
  # A instancia Lightsail foi deletada em 2026-04-23 (ver COLOCAR_NO_AR.md).
  # Este arquivo tinha o IP 32.194.117.29 HARDCODED (nem usava variavel) — e a
  # AWS ja devolveu esse IP ao pool, entao ele pode pertencer a outra pessoa
  # hoje. Com o job ativo, todo push na main abria SSH nesse endereco.
  #
  # O IP fixo foi substituido por $LIGHTSAIL_HOST, alinhando com os outros
  # repositorios, para nunca mais ficar preso a um endereco no codigo.
  #
  # PARA REATIVAR:
  #   1. Restaurar a instancia a partir do snapshot (ver COLOCAR_NO_AR.md)
  #   2. Criar a variavel LIGHTSAIL_HOST em Settings > CI/CD > Variables
  #   3. Criar a variavel DEPLOY_ENABLED = "true" no mesmo lugar
  #
  # Enquanto DEPLOY_ENABLED nao existir, o job nem e criado — sem pipeline
  # pendente e sem e-mail de falha.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DEPLOY_ENABLED == "true"'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "ubuntu@$LIGHTSAIL_HOST" "bash ~/deploy.sh storefront"
