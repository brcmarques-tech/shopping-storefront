stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H 32.194.117.29 >> ~/.ssh/known_hosts
  script:
    - ssh ubuntu@32.194.117.29 "bash ~/deploy.sh storefront"
  only:
    - main
